name: SMS diagnostics
on:
  push:
    branches: [fix/sms-travis-only-diagnostics]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BHBREAKFASTMENU }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect configuration without exposing credentials
        shell: bash
        run: |
          gcloud functions describe api --gen2 --region us-central1 --project bhbreakfastmenu --format=json > /tmp/function.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/function.json'))
          s=d.get('serviceConfig',{})
          print(json.dumps({'state':d.get('state'),'runtime':d.get('buildConfig',{}).get('runtime'),'uri':s.get('uri'),'environment_names':list(s.get('environmentVariables',{})),'secret_names':[v.get('key') for v in s.get('secretEnvironmentVariables',[])]},indent=2))
          PY
      - name: Verify deployed source matches the baseline
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/function.json'))['buildConfig']['source']['storageSource']
          open('/tmp/source-uri','w').write('gs://'+s['bucket']+'/'+s['object'])
          PY
          gcloud storage cp "$(cat /tmp/source-uri)" /tmp/deployed-source.zip
          git fetch origin main --depth=1
          git show FETCH_HEAD:functions/index.js > /tmp/baseline-index.js
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/deployed-source.zip')
          candidates=[n for n in z.namelist() if n in ('index.js','functions/index.js')]
          assert len(candidates)==1, 'Cannot uniquely identify deployed source'
          assert z.read(candidates[0])==open('/tmp/baseline-index.js','rb').read(), 'Deployed code differs from main; stop for review'
          print('Deployed source matches baseline.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and deploy Travis-only SMS diagnostics
        run: |
          node --test functions/sms.test.js
          npm install --prefix functions --no-audit --no-fund
          npx --yes firebase-tools deploy --only functions:api --project bhbreakfastmenu --non-interactive
